name: customer_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_stripe: ^14.1.0
  go_router: ^18.0.2
  google_maps_flutter: ^2.18.2
  intl: ^0.20.3
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  # Plus Jakarta Sans (SIL OFL 1.1, assets/fonts/OFL.txt), variable weight. Arabic/Devanagari fall back to the system font.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
