; Dev tuning for the Windows bind mount (9p): Laravel + Filament vendor is ~15k PHP files,
; so the default 10k OPcache slots thrash and every miss re-reads over the slow mount.
opcache.enable=1
opcache.max_accelerated_files=40000
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
; Each file is re-stat()ed at most every 60 s (a stat over 9p is slow and a request loads ~1k files).
; PHP edits show up within a minute, or at once after `docker compose restart app`. Default 2 s cost 6 s per request.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
realpath_cache_size=16M
realpath_cache_ttl=600
